<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1a1c; }
      #root { position: relative; width: 100%; height: 100%; }
      #escena { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <canvas id="escena" width="1080" height="1920"></canvas>
    </div>
    <script type="module">
      import * as THREE from "./lib/three.module.js";
      const canvas = document.getElementById("escena");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.shadowMap.enabled = true;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0b1a1c");
      scene.fog = new THREE.Fog("#1d3b3f", 8, 30);
      const cam = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 100);

      // Sala: piso, pantalla emisiva verde azulada, filas de butacas carmesí
      const piso = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: "#14100f", roughness: 0.9 }));
      piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; scene.add(piso);
      const pantalla = new THREE.Mesh(new THREE.PlaneGeometry(12, 5.2), new THREE.MeshBasicMaterial({ color: "#7fb3ad" }));
      pantalla.position.set(0, 4, -14); scene.add(pantalla);
      const luzPantalla = new THREE.RectAreaLight ? null : null;
      const key = new THREE.SpotLight("#bfe3dc", 60, 40, 0.6, 0.6); key.position.set(0, 4, -13); key.target.position.set(0, 0, 0);
      key.castShadow = true; scene.add(key, key.target);
      const rim = new THREE.PointLight("#e0a526", 25, 20); rim.position.set(-6, 7, 4); scene.add(rim);
      scene.add(new THREE.AmbientLight("#1d3b3f", 0.6));
      const mat = new THREE.MeshStandardMaterial({ color: "#7a1020", roughness: 0.55 });
      for (let fila = 0; fila < 4; fila++) {
        const n = 5 - Math.min(fila, 2);
        for (let i = 0; i < n; i++) {
          const g = new THREE.Group();
          const asiento = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.15, 0.5), mat); asiento.position.y = 0.45;
          const respaldo = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.12), mat); respaldo.position.set(0, 0.85, 0.22);
          [asiento, respaldo].forEach(m => { m.castShadow = true; g.add(m); });
          g.position.set((i - (n - 1) / 2) * 0.75, fila * 0.25, fila * 1.3 - 2);
          scene.add(g);
        }
      }
      // Espectador (silueta simple): torso mostaza + cabeza, de espaldas
      const esp = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.4, 6, 12), new THREE.MeshStandardMaterial({ color: "#e0a526", roughness: 0.8 }));
      torso.position.y = 1.0;
      const cabeza = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), new THREE.MeshStandardMaterial({ color: "#2a1d17" }));
      cabeza.position.y = 1.48;
      esp.add(torso, cabeza); esp.position.set(0.37, 0.25, -0.7); scene.add(esp);

      const ease = t => t * t * (3 - 2 * t);
      function renderAt(t) {
        const k = ease(Math.min(1, t / 4));
        cam.position.set(0.3, 2.6 - k * 0.8, 5 - k * 9);
        cam.lookAt(0, 3.2 + k * 0.6, -14);
        renderer.render(scene, cam);
      }
      window.addEventListener("hf-seek", e => renderAt(e.detail.time));
      renderAt(0);
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
