<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Paleta v0 del canal (imagen ancla): bruma verde azulada + mostaza + carmesí */
      :root {
        --bruma: #1d3b3f;
        --bruma-osc: #0b1a1c;
        --mostaza: #e0a526;
        --carmesi: #7a1020;
        --crema: #f4ead2;
        --font-display: "Archivo Black";
        --font-texto: "Oswald";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bruma-osc); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #fondo {
        position: absolute; inset: -80px;
        background:
          radial-gradient(60% 40% at 70% 35%, rgba(224,165,38,.22), transparent 70%),
          radial-gradient(70% 50% at 30% 70%, rgba(122,16,32,.25), transparent 70%),
          linear-gradient(180deg, var(--bruma) 0%, var(--bruma-osc) 100%);
      }
      .gancho-wrap { position: absolute; left: 120px; right: 192px; top: 560px; }
      #gancho {
        font-family: var(--font-display); color: var(--crema);
        font-size: 96px; line-height: 1.02; letter-spacing: -0.01em;
        text-shadow: 0 6px 30px rgba(0,0,0,.55);
      }
      #gancho em { font-style: normal; color: var(--mostaza); }
      .banner-wrap { position: absolute; left: 0; right: 0; top: 1060px; display: flex; justify-content: center; }
      #banner {
        background: var(--carmesi); color: var(--crema);
        font-family: var(--font-display); font-size: 120px; padding: 14px 48px 6px;
        box-shadow: 0 12px 40px rgba(0,0,0,.45);
      }
      .tarjeta-wrap { position: absolute; left: 120px; right: 192px; top: 300px; }
      #tarjeta {
        background: rgba(8,16,18,.72); padding: 34px 40px 30px; text-align: center;
        border-top: 6px solid var(--mostaza);
      }
      #tarjeta .titulo { font-family: var(--font-display); color: var(--crema); font-size: 84px; line-height: 1; }
      #tarjeta .sub { font-family: var(--font-texto); color: var(--mostaza); font-size: 40px; margin-top: 14px; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <div id="fondo" class="clip" data-start="0" data-duration="7" data-track-index="0"></div>

      <div id="c-gancho" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="gancho-wrap"><div id="gancho">Imagina que tienes <em>48 horas</em> para salir de la ciudad…</div></div>
      </div>

      <div id="c-banner" class="clip" data-start="2.2" data-duration="2.3" data-track-index="2">
        <div class="banner-wrap"><div id="banner">48 H</div></div>
      </div>

      <div id="c-tarjeta" class="clip" data-start="4.4" data-duration="2.6" data-track-index="3">
        <div class="tarjeta-wrap">
          <div id="tarjeta">
            <div class="titulo">TÍTULO EN CHILE</div>
            <div class="sub">TÍTULO ORIGINAL · 2026</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#fondo", { scale: 1.0 }, { scale: 1.06, duration: 7, ease: "none" }, 0);
      tl.fromTo("#gancho", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#gancho", { opacity: 0, duration: 0.2 }, 2.75);
      tl.fromTo("#banner", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" }, 2.2);
      tl.to("#banner", { opacity: 0, duration: 0.15 }, 4.3);
      tl.fromTo("#tarjeta", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
