.tarjeta .titulo{font-family:"Archivo Black";color:var(--crema);font-size:84px;line-height:1}
.tarjeta .sub{font-family:"Oswald";color:var(--mostaza);font-size:40px;margin-top:14px;letter-spacing:.08em}
